server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache estático para assets versionados
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — toda rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck simples
    location = /web-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy opcional pro MCP — quando o front roda no mesmo host, dá pra
    # apontar a URL do MCP no painel pra http://localhost:8080/mcp e bater aqui.
    # CORS é tratado pelo próprio servidor MCP.
    location /mcp {
        proxy_pass         http://mcp-server:3000/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass         http://mcp-server:3000/health;
        proxy_http_version 1.1;
    }
}

services:
  mcp-server:
    build: .
    expose:
      - "3000"
    env_file: .env
    environment:
      - MCP_TRANSPORT=http
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - mcp-server
    restart: unless-stopped
